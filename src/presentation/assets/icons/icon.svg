  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />

  <rect x="48" y="48" width="416" height="416" rx="80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />

