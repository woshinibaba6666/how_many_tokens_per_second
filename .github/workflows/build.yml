name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Zip exe
        shell: pwsh
        run: |
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/how-many-tokens-per-second.exe"
          $zip = "how-many-tokens-per-second_windows_x64.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          Write-Host "Created $zip ($($(Get-Item $zip).Length / 1MB) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: how-many-tokens-per-second-windows-x64
          path: "*.zip"
          retention-days: 7
